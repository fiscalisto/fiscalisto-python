[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fiscalisto"
version = "0.1.0"
description = "SDK de la API de facturación electrónica (CFDI 4.0) de Fiscalisto, para Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["cfdi", "factura", "facturacion", "sat", "mexico", "timbrado", "fiscalisto"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://fiscalisto.com/docs/api/sdk/python"
Documentation = "https://fiscalisto.com/docs/api"
Source = "https://github.com/RVP97/invoices-retriever/tree/main/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["src/fiscalisto"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/fiscalisto/types.py", "src/fiscalisto/_resources.py"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
