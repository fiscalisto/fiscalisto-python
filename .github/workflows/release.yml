# Publishes the package to PyPI when a version tag (v0.1.1) arrives from Fiscalisto's
# repository (scripts/sdk-release.sh), after its tests. Trusted publishing: PyPI checks this
# workflow's identity, so there's no token.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the package's version
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml
      - run: PYTHONPATH=src python -m unittest discover -s tests -q
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
